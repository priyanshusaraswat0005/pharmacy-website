<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lab Tests - MediCare</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-left">
    <h1>MediCare </h1>
  </div>
  <nav id="headerNav"></nav>
</header>

<div class="banner">
  <h2>Book Lab Tests at Home</h2>
  <p>Our team collects your sample at home and reports come online</p>
</div>

<div class="container">
  <div id="notLoggedMsg" style="display:none;" class="message warning">Please login first to book a lab test.</div>

  <div id="testsGrid" class="medicine-grid">
    <p>Loading tests...</p>
  </div>
</div>

<div id="bookingModalBg" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">
  <div style="background:white; max-width:420px; margin:60px auto; padding:20px; border-radius:8px;">
    <h3 id="bookingTestName"></h3>
    <form id="bookingForm">
      <label>Address for Sample Collection</label>
      <textarea id="bookingAddress" rows="3" required></textarea>
      <label>Phone Number</label>
      <input type="tel" id="bookingPhone" pattern="[0-9]{10}" required>
      <label>Preferred Date</label>
      <input type="date" id="bookingDate" required>
      <button type="submit">Confirm Booking</button>
      <button type="button" onclick="closeBookingModal()" style="background-color:#999;">Cancel</button>
    </form>
  </div>
</div>

<footer>
  MediCare Pharmacy | Your health, in one place.
</footer>

<script src="script.js"></script>
<script>
  let selectedTest = null;

  if (!isLoggedIn()) {
    document.getElementById("notLoggedMsg").style.display = "block";
  }

  fetch("/api/lab-tests")
    .then(function (res) { return res.json(); })
    .then(function (tests) {
      const grid = document.getElementById("testsGrid");
      let html = "";

      for (let i = 0; i < tests.length; i++) {
        const t = tests[i];
        html = html +
          "<div class='medicine-card'>" +
          "<h3>" + t.name + "</h3>" +
          "<p>" + t.description + "</p>" +
          "<p class='price'>Rs. " + t.price + "</p>" +
          "<button onclick='openBookingModal(" + t.id + ", \"" + t.name.replace(/"/g, "") + "\", " + t.price + ")'>Book Now</button>" +
          "</div>";
      }

      grid.innerHTML = html;
    });

  function openBookingModal(id, name, price) {
    if (!isLoggedIn()) {
      alert("Please login first");
      window.location.href = "login.html";
      return;
    }

    selectedTest = { id: id, name: name, price: price };
    document.getElementById("bookingTestName").innerText = name + " - Rs. " + price;
    document.getElementById("bookingModalBg").style.display = "block";

    fetch("/api/user/" + getUserId())
      .then(function (res) { return res.json(); })
      .then(function (user) {
        if (user.address) {
          document.getElementById("bookingAddress").value = user.address;
        }
        if (user.phone) {
          document.getElementById("bookingPhone").value = user.phone;
        }
      });
  }

  function closeBookingModal() {
    document.getElementById("bookingModalBg").style.display = "none";
  }

  document.getElementById("bookingForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const address = document.getElementById("bookingAddress").value;
    const phone = document.getElementById("bookingPhone").value;
    const bookingDate = document.getElementById("bookingDate").value;

    fetch("/api/lab-booking", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        userId: getUserId(),
        testName: selectedTest.name,
        price: selectedTest.price,
        address: address,
        phone: phone,
        bookingDate: bookingDate
      })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.success) {
          alert("Test booked successfully. Our team will visit on the selected date.");
          closeBookingModal();
        } else {
          alert("Something went wrong, try again");
        }
      });
  });
</script>

</body>
</html>
