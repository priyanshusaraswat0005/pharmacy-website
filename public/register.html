<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - MediCare</title>
<link rel="stylesheet" href="style.css">
<style>
  .login-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #f1f5f2;
  }
  .login-page header {
    background: #123c38;
  }
  .login-page header h1 span {
    color: #b8d9cc;
  }
  .login-page-wrap {
    width: min(100% - 32px, 470px);
    margin: auto;
    padding: 42px 0;
  }
  .login-card {
    padding: 38px 42px 30px;
    border: 1px solid #dfe8e3;
    border-radius: 7px;
    background: #fff;
    box-shadow: 0 18px 50px rgba(26, 58, 49, 0.1);
  }
  .login-card h2 {
    margin: 0 0 8px;
    color: #18332e;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 29px;
    font-weight: normal;
  }
  .login-card p.sub {
    color: #61716e;
    font-size: 14px;
    margin: 0 0 20px;
  }
  .login-card form {
    padding: 0;
    max-width: 100%;
    border: 0;
    box-shadow: none;
  }
  .login-card button {
    width: 100%;
    margin-top: 22px;
    border-color: #145b50;
    background: #145b50;
    color: #fff;
    font-weight: bold;
  }
  .login-links {
    margin-top: 22px;
    padding-top: 14px;
    border-top: 1px solid #e6ece8;
    color: #61716e;
    font-size: 13px;
    text-align: center;
  }
  .login-links a {
    color: #145b50;
    font-weight: bold;
  }
  .login-page footer {
    margin-top: 0;
  }
  @media (max-width: 500px) {
    .login-card {
      padding: 30px 24px 24px;
    }
  }
</style>
</head>
<body class="login-page">

<header>
  <div class="header-left">
    <h1>MediCare <span>Apni Dawai, Apne Ghar</span></h1>
  </div>
  <nav id="headerNav"></nav>
</header>

<div class="container">
  <div class="login-page-wrap">

    <div class="login-card">
      <h2>Create your account</h2>
      <p class="sub">Sign up in a minute and start ordering genuine medicines.</p>

      <div id="msgBox"></div>

      <form id="registerForm">
        <label>Full Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" autocapitalize="off" autocorrect="off" spellcheck="false" required>

        <label>Age</label>
        <input type="number" id="age" min="1" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="submit">Create Account</button>
      </form>

      <div class="login-links">
        <p>Already have an account? <a href="login.html">Login here</a></p>
        <p><a href="index.html">Not a patient? Switch role</a></p>
      </div>
    </div>

  </div>
</div>

<footer>
  MediCare Pharmacy | Your health, in one place.
</footer>

<script src="script.js"></script>
<script>
  document.getElementById("registerForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const age = document.getElementById("age").value;
    const password = document.getElementById("password").value;

    if (age < 18) {
      document.getElementById("msgBox").innerHTML = "<div class='message error'>You must be 18 or above to register.</div>";
      return;
    }

    fetch("/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, email: email, age: age, password: password })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.success) {
          localStorage.setItem("userId", data.userId);
          localStorage.setItem("userName", data.name);
          window.location.href = "home.html";
        } else {
          document.getElementById("msgBox").innerHTML = "<div class='message error'>" + data.message + "</div>";
        }
      })
      .catch(function () {
        document.getElementById("msgBox").innerHTML = "<div class='message error'>Something went wrong, please try again.</div>";
      });
  });
</script>

</body>
</html>
